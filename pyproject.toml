[project]
name = "dnd5e-engine"
version = "0.1.0"
description = "Local DnD 5e (SRD 5.1) MCP server: dice, checks, encounter math, SRD lookup"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.33.0",
    "mcp[cli]>=1.12,<2",
    "openai>=2.41.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
